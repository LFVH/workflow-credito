name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify

  # O gateway é um projeto Maven separado: não entra no "mvn verify" da raiz.
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: gateway/pom.xml   # cache próprio, chaveado pelo pom do gateway
      - run: mvn -B verify -f gateway/pom.xml

  # Imagem que não constrói é bug. Só constrói depois que os testes dos dois projetos passaram.
  imagens:
    runs-on: ubuntu-latest
    needs: [build, gateway]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
