spring.graphql.graphiql.enabled=true
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/workflow_db
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Dinheiro na borda (vale para o REST e, por tabela, para o JSON do /graphql)
# BigDecimal escrito por extenso: 1000, nunca 1E+3
spring.jackson.generator.write-bigdecimal-as-plain=true
# Número com casas decimais em destino sem tipo (Object, Map, JsonNode) vira BigDecimal, nunca double
spring.jackson.deserialization.use-big-decimal-for-floats=true

# REST: erros do próprio Spring MVC (400, 405, 415...) também como ProblemDetail (RFC 9457)
spring.mvc.problemdetails.enabled=true

# springdoc: documenta só a API REST (o GraphQL tem o próprio schema e o GraphiQL)
springdoc.paths-to-match=/api/**

# Fase 5: Kafka. No notebook não há Kafka: o relay e o consumidor ficam desligados e a
# aplicação sobe sem tentar conectar. No Codespaces: OUTBOX_RELAY=true e KAFKA_LISTENERS=true.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.listener.auto-startup=${KAFKA_LISTENERS:false}
# Grupo de consumidores novo começa do início do tópico: perder evento é pior que reprocessar
# (o consumidor é idempotente). O padrão do Kafka, latest, ignoraria o que veio antes.
spring.kafka.consumer.auto-offset-reset=earliest

# Relay do outbox: lê outbox_evento e publica no Kafka (adapters.out.outbox.OutboxRelayConfig)
workflow.outbox.relay.habilitado=${OUTBOX_RELAY:false}
workflow.outbox.relay.intervalo-ms=1000
workflow.outbox.relay.lote=100

# Fase 6: Actuator. Só o health fica exposto na web (é o que o healthcheck do compose chama).
# "env" e "beans" mostrariam variáveis de ambiente, senhas mascaradas pela metade e a estrutura interna.
management.endpoints.web.exposure.include=health

# Fase 6: atrás do gateway. Monta URLs absolutas (o Location do REST, o redirect do GraphiQL)
# com os X-Forwarded-* que o gateway envia. Seguro aqui porque a aplicação não tem porta
# publicada: só o gateway fala com ela, e é ele quem decide em quem confiar (trusted-proxies).
server.forward-headers-strategy=framework
