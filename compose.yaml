# Infraestrutura da fase 5, para o GitHub Codespaces (ou qualquer máquina com Docker).
# A aplicação roda FORA do compose, no host do Codespace (mvn spring-boot:run).
# Na fase 6, a aplicação e o gateway entram aqui como serviços.
services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"   # mesma porta padrao do application.properties (DB_PORT, padrao 5432)
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workflow_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1   # mesma versão do kafka-clients gerenciado pelo Spring Boot 3.5.6
    hostname: kafka
    ports:
      - "9092:9092"   # só o listener do host é publicado
    environment:
      # KRaft com nó único: o mesmo processo é broker e controller (sem ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # Dois listeners de clientes:
      #   PLAINTEXT_HOST -> localhost:9092, para quem roda no host (mvn spring-boot:run, kafka-console-consumer)
      #   PLAINTEXT      -> kafka:29092, para outros containers da rede do compose (fase 6)
      KAFKA_LISTENERS: "CONTROLLER://:9093,PLAINTEXT_HOST://:9092,PLAINTEXT://:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # Obrigatório quando KAFKA_PROCESS_ROLES é informado (valor do exemplo oficial da Apache)
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      # Um broker só: tudo com replicação 1 (o padrão interno é 3 e o broker não subiria os tópicos internos)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      # O script de partida usa 1 GB de heap por padrão; 512 MB bastam aqui
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

volumes:
  postgres-dados:
