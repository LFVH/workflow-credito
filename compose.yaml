# Fase 6: o sistema inteiro com um comando:
#   docker compose up --build --wait
# Só o gateway publica porta para fora (8080). A aplicação fica na rede interna do compose:
# quem quiser falar com ela passa pelo gateway. Postgres e Kafka publicam portas só em
# 127.0.0.1, para inspeção de dentro do Codespace (psql, ferramentas do Kafka, ou o
# "mvn spring-boot:run" do item 08 com "docker compose up -d postgres kafka").
services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"   # só de dentro da máquina; "5432:5432" publicaria para a rede toda.
                                # 5432: a mesma porta padrão do application.properties (DB_PORT)
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workflow_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1   # mesma versão do kafka-clients gerenciado pelo Spring Boot 3.5.6
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"   # só o listener do host (PLAINTEXT_HOST), só de dentro da máquina
    environment:
      # KRaft com nó único: o mesmo processo é broker e controller (sem ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # Dois listeners de clientes:
      #   PLAINTEXT_HOST -> localhost:9092, para quem roda no host do Codespace
      #   PLAINTEXT      -> kafka:29092, para os containers desta rede (a aplicação)
      KAFKA_LISTENERS: "CONTROLLER://:9093,PLAINTEXT_HOST://:9092,PLAINTEXT://:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # Obrigatório quando KAFKA_PROCESS_ROLES é informado (valor do exemplo oficial da Apache)
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      # Um broker só: tudo com replicação 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      # O script de partida usa 1 GB de heap por padrão; 512 MB bastam aqui
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  app:
    build: .
    environment:
      # Dentro do container, "localhost" é o próprio container: o banco é o serviço "postgres",
      # na porta INTERNA 5432 do container (a publicada só vale em 127.0.0.1, do lado de fora).
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/workflow_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      # O listener interno do Kafka (PLAINTEXT, anunciado como kafka:29092)
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Placeholders do item 08: relay do outbox e @KafkaListener ligados.
      # Atenção: este KAFKA_LISTENERS NÃO é o do broker; cada container tem o próprio ambiente.
      OUTBOX_RELAY: "true"
      KAFKA_LISTENERS: "true"
      # 60% de 1 GB para o heap; o resto fica para metaspace, threads, buffers e o próprio SO
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError"
    expose:
      - "8080"                  # só documenta. SEM "ports": nada de fora alcança a aplicação
    mem_limit: 1g               # sem limite, o MaxRAMPercentage seria calculado sobre a máquina inteira
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s         # tempo de subida (Flyway, Hibernate, Kafka) sem contar como falha
    restart: unless-stopped

  gateway:
    build: ./gateway
    environment:
      APP_URI: http://app:8080
      # O Netty também usa memória fora do heap (buffers diretos): percentual menor
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50 -XX:+ExitOnOutOfMemoryError"
    ports:
      - "8080:8080"             # a ÚNICA porta publicada para fora
    mem_limit: 512m
    depends_on:
      - app                     # só a ordem de criação; NÃO espera a aplicação ficar saudável
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  postgres-dados:
